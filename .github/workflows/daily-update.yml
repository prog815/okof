name: Daily OKOF Update

on:
  schedule:
    # 20:00 UTC = 23:00 МСК. Слоты: ОКВЭД2 05:00 / ОКПД2 11:30 / ОКТМО 12:00 / ОКЕИ 13:00 / ОКАТО 14:00 / ОКОГУ 15:00 / ОКОПФ 16:00 / ОКФС 17:00 / ОКВ 18:00 / ОКСМ 19:00 / ОКОФ 20:00
    - cron: '0 20 * * *'
  workflow_dispatch:          # ручной запуск

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04     # пин образа: убирает notice про миграцию ubuntu-latest -> 26.04
    timeout-minutes: 10
    permissions:
      contents: write         # встроенный токен Actions для коммита
    env:
      # API-токен Kaggle НОВОГО образца (CLI >= 1.8.0).
      # В репозитории секрет называется KAGGLE_API_TOKEN_OKOF, внутри него чистый токен.
      # В Kaggle токен называется gha-okof.
      # Kaggle CLI читает переменную окружения KAGGLE_API_TOKEN напрямую.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_OKOF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI с поддержкой API-токенов (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI поддерживает API-токены")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/okof-classifier-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -30
          echo ""
          echo "--- Диагностика тетрадки (если есть) ---"
          for f in ./output/okof_data/diag/okof_diagnostics.json ./output/*.log ./output/*.txt ./output/__notebook*.ipynb; do
            [ -f "$f" ] && { echo ">>> $f (last 50 lines) >>>"; tail -n 50 "$f"; echo "<<< $f <<<"; echo ""; }
          done || true

      - name: Copy web files to repo root (авто-детект SRC, не падает, ставит флаг)
        id: copy
        run: |
          # ВАЖНО ПРО ОКОФ:
          # Тетрадка ОКОФ пишет публикуемые артефакты в конвенционный подпуть
          # /kaggle/working/okof_data/web/ (как ОКОПФ/ОКФС/ОКАТО/ОКТМО/ОКОГУ/ОКСМ),
          # а НЕ в голый /kaggle/working/web/ (как ОКВ). Поэтому основным кандидатом
          # SRC является ./output/okof_data/web. Авто-детект по списку кандидатов
          # оставлен только для устойчивости на случай будущего патча тетрадки;
          # ГОЛЫЙ ./output как SRC НЕ используется НИКОГДА (грабли ОКЕИ v1.2).
          #
          # Кандидаты (первым — конвенционный путь ОКОФ):
          #   1) ./output/okof_data/web  <- текущее состояние тетрадки ОКОФ
          #   2) ./output/web            <- фолбэк, если тетрадку когда-то перепатчат
          # Маркер правильного каталога - наличие okof.json.
          SRC=""
          for cand in ./output/okof_data/web ./output/web; do
            if [ -f "$cand/okof.json" ]; then SRC="$cand"; break; fi
          done

          if [ -z "$SRC" ]; then
            echo "::warning::не найден каталог с okof.json ни в ./output/okof_data/web, ни в ./output/web (тетрадка, вероятно, упала на critical или писала не туда)"
            echo "--- дерево ./output для отладки пути ---"
            find ./output -type f 2>/dev/null | head -60 || true
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "SRC=$SRC"
            MISSING=0
            for f in okof.json okof.json.gz okof_meta.json okof_meta.json.gz; do
              if [ -f "$SRC/$f" ]; then
                cp "$SRC/$f" "./$f"
                echo "copied $f"
              else
                echo "::warning::MISSING $f в $SRC"
                MISSING=$((MISSING+1))
              fi
            done
            if [ "$MISSING" -gt 0 ]; then
              echo "Отсутствует $MISSING из 4 файлов - коммит пропущен, сайт остаётся на последней хорошей версии"
              echo "FILES_OK=false" >> "$GITHUB_ENV"
            else
              echo "Все 4 файла на месте"
              echo "FILES_OK=true" >> "$GITHUB_ENV"
              echo "--- okof_meta.json (редакция / warnings / critical) ---"
              python -m json.tool okof_meta.json || cat okof_meta.json
            fi
          fi

      - name: Check metadata — гейт публикации META_OK
        if: env.FILES_OK == 'true'
        run: |
          # v-next.2: гейт публикации перед коммитом.
          # Блокирует коммит, если:
          #   - publish_allowed != true
          #   - critical_errors не пустой
          #   - data_hash_full невалиден (не 64 hex)
          #   - data_hash невалиден (не 16 hex) или data_hash != data_hash_full[:16]
          #   - records_count <= 0
          # Не роняет workflow (exit 0), чтобы финальный round-trip под if: always()
          # всё равно отработал. Флаг META_OK=false не даёт Commit and push выполниться.
          python - <<'EOF'
          import json, re, os, sys

          with open('okof_meta.json', encoding='utf-8') as f:
              meta = json.load(f)

          errors = []

          # 1) publish_allowed
          if meta.get('publish_allowed') is not True:
              errors.append("publish_allowed is not True (got %r)" % (meta.get('publish_allowed'),))

          # 2) critical_errors
          crit = meta.get('critical_errors')
          if not isinstance(crit, list):
              errors.append("critical_errors is not a list")
          elif len(crit) > 0:
              errors.append("critical_errors not empty: %d item(s); first: %r" % (len(crit), crit[0]))

          # 3) data_hash_full
          data_hash_full = meta.get('data_hash_full')
          if not isinstance(data_hash_full, str) or not re.fullmatch(r'[0-9a-f]{64}', data_hash_full or ''):
              errors.append("data_hash_full is not a valid sha256 hex (64 lowercase hex chars)")

          # 4) data_hash
          data_hash = meta.get('data_hash')
          if not isinstance(data_hash, str) or not re.fullmatch(r'[0-9a-f]{16}', data_hash or ''):
              errors.append("data_hash is not a valid prefix (16 lowercase hex chars)")

          # 5) data_hash == data_hash_full[:16]
          if (isinstance(data_hash, str) and isinstance(data_hash_full, str)
                  and data_hash and data_hash_full and data_hash != data_hash_full[:16]):
              errors.append("data_hash != data_hash_full[:16]")

          # 6) records_count
          records_count = meta.get('records_count')
          if not isinstance(records_count, int) or records_count <= 0:
              errors.append("records_count <= 0 (got %r)" % (records_count,))

          # Non-blocking diagnostics in the log
          print("META diagnostics:")
          print("  classifier_name:", meta.get('classifier_name'))
          print("  change_display:", meta.get('change_display'))
          print("  records_count:", records_count)
          print("  declared_count:", meta.get('declared_count'))
          print("  sections_count:", meta.get('sections_count'))
          print("  publish_allowed:", meta.get('publish_allowed'))
          print("  critical_errors:", len(crit) if isinstance(crit, list) else crit)
          print("  warnings:", len(meta.get('warnings') or []))
          print("  data_hash:", data_hash)
          print("  data_hash_full:", data_hash_full)
          print("  presence_guard_version:", meta.get('presence_guard_version'))

          env_path = os.environ['GITHUB_ENV']

          if errors:
              print()
              for e in errors:
                  print("::error::META: " + e)
              with open(env_path, 'a', encoding='utf-8') as f:
                  f.write('META_OK=false\n')
              print()
              print("META_OK=false — коммит будет пропущен, сайт остаётся на последней хорошей версии")
              sys.exit(0)

          with open(env_path, 'a', encoding='utf-8') as f:
              f.write('META_OK=true\n')
          print()
          print("META_OK=true — метаданные прошли гейт публикации")
          EOF

      - name: Commit and push changes
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add okof.json okof.json.gz okof_meta.json okof_meta.json.gz
          if git diff --cached --quiet; then
            echo "Изменений нет - данные уже актуальны"
          else
            # ОКОФ: в мете ЕСТЬ стабильное поле source_date (= editorial_effective_date,
            # для текущего снимка 2026-10-01). Читаем его первым, далее фолбэки
            # effective_date -> generated_at -> '?'. Однострочный python -c (БЕЗ heredoc!) -
            # heredoc внутри $() в run:| ломает терминатор из-за отступов YAML и даёт
            # exit 2. Не менять на heredoc.
            SOURCE_DATE=$(python -c "import json; m=json.load(open('okof_meta.json')); print(m.get('source_date') or m.get('effective_date') or m.get('generated_at') or '?')" 2>/dev/null || echo '?')
            git commit -m "Auto-update: OKOF data from kernel output (source $SOURCE_DATE) [skip ci]"
            git push
            echo "Изменения запушены"
          fi

      - name: Trigger new notebook run (fire-and-forget, всегда)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/okof-classifier-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"